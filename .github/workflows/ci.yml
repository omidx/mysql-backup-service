name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile mysql_backup_service.py
      - name: Shell syntax
        run: |
          bash -n backup_script.sh
          bash -n install.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Config smoke test
        run: python3 mysql_backup_service.py --config mysql-backup.conf.example config-test
      - name: CLI smoke tests
        run: |
          python3 mysql_backup_service.py --help >/dev/null
          test "$(python3 mysql_backup_service.py version)" = "2.1.0"
